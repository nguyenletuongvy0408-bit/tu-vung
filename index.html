<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c8565">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Từ Vững">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Từ Vững</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{--f:"Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif;--bg:#f3f6f4;--panel:#fff;--soft:#eef2ef;--ink:#17231f;--muted:#5d6b66;--line:#dfe6e2;--accent:#0f8a68;--accent-ink:#fff;--accent-soft:#d9f2e8;--good:#0f8a68;--good-soft:#dcf5ea;--bad:#d2402f;--bad-soft:#fde6e2;--warn:#a86a00;--warn-soft:#fff1d2;--u:#2f6fdb;--a:#d9592a;--d:#0f8a68;--grad:linear-gradient(120deg,#0c8565,#1668a8);--shadow:0 6px 22px rgba(20,50,40,.08);--b1:#bff0dc;--b2:#ffe0c7}
@media (prefers-color-scheme:dark){:root{--bg:#101714;--panel:#18211d;--soft:#222d28;--ink:#eef4f0;--muted:#9fb0a9;--line:#2e3b35;--accent:#45d6a8;--accent-ink:#06231a;--accent-soft:#17382c;--good:#45d6a8;--good-soft:#17382c;--bad:#ff8f7d;--bad-soft:#452420;--warn:#f1bd5c;--warn-soft:#42331a;--u:#86b6ff;--a:#ffa77d;--d:#45d6a8;--grad:linear-gradient(120deg,#0e7f60,#15629f);--shadow:0 6px 22px rgba(0,0,0,.35);--b1:#12352a;--b2:#3a2a1c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.25;margin:0}
#app{display:grid;grid-template-columns:190px minmax(0,1fr);height:100dvh}
#nav{border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font:700 25px var(--f);padding:0 10px 18px;letter-spacing:-.3px}
.brand span{color:var(--accent)}
.nav-b{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px;border-radius:9px;text-align:left;color:var(--muted);font-weight:600}
.nav-b:hover{background:var(--soft)}
.nav-b.on{background:var(--accent-soft);color:var(--accent)}
.nav-b svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#main{overflow-y:auto;padding:30px 24px 60px}
.wrap{max-width:700px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:14px}
h1.page{font:700 29px var(--f);margin-bottom:5px}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 15px;border-radius:9px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.main:hover{filter:brightness(1.08)}
.btn.big{padding:13px 22px;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 18px}
.step{background:var(--soft);border-radius:10px;padding:12px 8px;text-align:center}
.step b{display:block;font:700 29px var(--f);line-height:1.1}
.step span{font-size:14px;color:var(--muted)}
.step.u b{color:var(--u)}.step.a b{color:var(--a)}.step.d b{color:var(--d)}
input[type=text],input[type=password],input[type=search],textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.u{color:var(--u)}.chip.a{color:var(--a)}.chip.d{color:var(--d);background:var(--accent-soft)}.chip.w{color:var(--warn);background:var(--warn-soft)}
.w-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.w-row:first-child{border-top:0}
.w-main{flex:1;min-width:0}
.word{font:700 18px var(--f)}
.ico{border:0;background:none;width:36px;height:36px;border-radius:8px;color:var(--muted);display:inline-grid;place-items:center;flex:none}
.ico:hover{background:var(--soft)}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{height:7px;background:var(--soft);border-radius:9px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qlabel{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.qtext{font-size:21px;line-height:1.45;margin-bottom:18px;overflow-wrap:break-word}
.qtext .big{font:700 34px var(--f)}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-weight:700}
.hint{font-size:15px;color:var(--muted);margin:-8px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:9px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt kbd{font:600 13px var(--f);color:var(--muted);flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tok{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-weight:600}
.tok:hover{border-color:var(--accent)}
.tok.used{visibility:hidden}
.tray{min-height:54px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.fb{border-radius:11px;padding:14px 16px;margin-top:14px}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}.fb.close{background:var(--warn-soft)}
.fb h3{font-size:18px;margin-bottom:3px}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}.fb.close h3{color:var(--warn)}
.up{background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:9px;font-weight:700;margin-top:10px}
.pdots{display:inline-flex;gap:3px;vertical-align:middle}
.pdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pdots i.on{background:var(--accent)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);width:min(520px,calc(100vw - 32px));padding:20px;max-height:90dvh}
dialog::backdrop{background:#0006}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:30;font-weight:600;display:none;max-width:90vw}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.seg label{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px}
.seg label small{display:block;font-weight:400;color:var(--muted)}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:1100px){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
 #nav{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:5px;justify-content:space-around;background:var(--panel)}
 .brand{display:none}
 .nav-b{flex-direction:column;gap:1px;font-size:12px;padding:5px 2px;align-items:center}
 #main{padding:20px 16px 40px}
}

/* Giao diện và hiệu ứng */
body::before,body::after{content:"";position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);z-index:-1;opacity:.75;animation:float 18s ease-in-out infinite alternate}
body::before{background:var(--b1);top:-16vmax;left:-8vmax}
body::after{background:var(--b2);bottom:-22vmax;right:8vmax;animation-delay:-7s}
h1,h2,h3,p,.hint,.fb{text-wrap:pretty}
.qtext{text-wrap:balance;font-size:19px;font-weight:500;position:relative}
.qtext.has-say{padding-right:42px}
.qsay{position:absolute;right:0;top:0;color:var(--accent)}
.qtext .big{display:block;font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1.2;margin-bottom:6px;color:var(--accent)}
.kw{color:var(--accent);font-weight:700;white-space:nowrap}
.btn,.chip,.nav-b,.tok{white-space:nowrap}
h1.page{font-weight:800;letter-spacing:-.4px}
.brand{font-weight:800}.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.word{font-weight:700}
.card{border-color:transparent;border-radius:18px;box-shadow:var(--shadow)}
.btn,.opt,.say,.tok,.nav-b,.ico,.w-row{transition:transform .15s,box-shadow .15s,background .15s,border-color .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.12)}
.btn:active:not(:disabled),.tok:active,.opt:active:not(:disabled),.say:active{transform:scale(.97)}
.btn.main{background:var(--grad);border-color:transparent;color:#fff;position:relative;overflow:hidden}
.btn.main::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);transform:translateX(-100%)}
.btn.main:hover::after{transform:translateX(100%);transition:transform .6s}
.nav-b:hover svg{transform:scale(1.15)}.nav-b svg{transition:transform .15s}
.opt{border-radius:13px}.opt:hover:not(:disabled){transform:translateX(3px)}
.tok:hover{transform:translateY(-2px)}
.w-row{border-radius:8px}.w-row:hover{background:var(--soft)}
.ladder{gap:14px}
.step{position:relative;border-radius:14px;padding:14px 4px}
.step b{font-size:30px;font-weight:800}
.step span{font-weight:600;font-size:13px;white-space:nowrap}
.step.u{background:color-mix(in srgb,var(--u) 13%,var(--panel))}
.step.a{background:color-mix(in srgb,var(--a) 13%,var(--panel))}
.step.d{background:color-mix(in srgb,var(--d) 15%,var(--panel))}
.step:not(:last-child)::after{content:"";position:absolute;right:-10px;top:50%;margin-top:-5px;border:5px solid transparent;border-left:6px solid var(--muted);opacity:.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two .btn{padding:10px 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font-size:26px;font-weight:800;line-height:1.2}.stats span{font-size:14px;color:var(--muted)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px}
.filters select{width:100%!important}
.bar i{background:var(--grad);transition:width .45s cubic-bezier(.3,.9,.4,1)}
.bar.grow i{animation:grow .9s cubic-bezier(.3,.9,.4,1)}
.pdots{gap:2px}.pdots i{width:7px;height:7px}.pdots i.on{animation:pop .3s}
.blank{animation:pulse 1.6s ease-in-out infinite}
.combo{font-weight:800;color:var(--a);animation:pop .3s}
.up{background:var(--grad);color:#fff;animation:pop .4s}
.fb{animation:up .3s both}
.opt.right{animation:pop .35s}.opt.wrong{animation:shake .4s}
.in{animation:up .35s both}
.in .opt{animation:up .32s both}
.in .opt:nth-of-type(2){animation-delay:.05s}.in .opt:nth-of-type(3){animation-delay:.1s}.in .opt:nth-of-type(4){animation-delay:.15s}
.ring{position:relative;width:132px;height:132px;margin:2px auto 6px}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:11;stroke:var(--soft)}
.ring circle+circle{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:327;animation:ring 1s cubic-bezier(.3,.9,.4,1) both}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800}
.cf{position:fixed;left:50%;top:42%;width:9px;height:9px;border-radius:2px;z-index:40;pointer-events:none;animation:cf 1s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes grow{from{width:0}}
@keyframes ring{from{stroke-dashoffset:327}}
@keyframes float{to{transform:translate(6vmax,4vmax) scale(1.12)}}
@keyframes pulse{50%{border-color:transparent}}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (max-width:1100px){.tip{display:none}.filters{grid-template-columns:1fr 1fr}.filters #find{grid-column:1/-1}.ladder{gap:9px}.step:not(:last-child)::after{right:-8px}.step span{font-size:12px}}

/* Ôn tập dạng trò chuyện */
body.qm #nav{display:none}
body.qm #app{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important}
#main.qm{padding:0;overflow:hidden}
.cq{display:flex;flex-direction:column;height:100%;min-height:0}
.cq.in{animation:none}
.cq-h{background:var(--panel);border-bottom:1px solid var(--line);padding:max(8px,env(safe-area-inset-top)) 14px 10px}
.cq-t{display:flex;align-items:center;gap:8px;max-width:820px;margin:0 auto 6px;font-size:18px}
.cq-t b{color:var(--accent)}.cq-n{margin-left:auto;white-space:nowrap}
.cq-h .bar{max-width:820px;margin:0 auto}
.ava{width:36px;height:36px;flex:none;border-radius:50%;background:var(--grad);display:inline-grid;place-items:center}
.ava svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#thread{flex:1;overflow-y:auto;min-height:0;padding:14px 14px 18px}
.th{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0 46px;font-size:15px}
.t-bot{display:flex;gap:10px;align-items:flex-end}
.bub{background:var(--good-soft);border:1.5px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:20px 20px 20px 6px;padding:13px 16px;max-width:min(640px,100%);min-width:0;overflow-wrap:break-word}
.bub.pop{animation:up .3s both}
.bub.res{flex:1;background:var(--panel)}
.bub.res.fb{margin:0;background:var(--good-soft)}
.bub.res.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.lab{font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.bub .qtext{font-size:18px;margin:0;padding:0;text-wrap:pretty}
.bub .qtext .big{font-size:32px;margin-bottom:2px}
.bub .hint{margin:7px 0 0;padding-top:7px;border-top:1px dashed var(--line);font-size:15px}
.quote{background:var(--panel);border-radius:12px;padding:10px 13px;margin-top:9px;font-style:italic;font-weight:400}
.vi{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);color:var(--muted);font-size:15px}
.tools{display:flex;gap:6px;margin-top:6px}
.tools .ico{background:var(--panel);color:var(--accent);font-size:12px}
.who{align-self:flex-end;font-size:13px;color:var(--muted);font-weight:600}
.t-me{display:flex;justify-content:flex-end}
.bub-me{background:color-mix(in srgb,var(--u) 15%,var(--panel));border-radius:20px 20px 6px 20px;padding:10px 16px;max-width:82%;overflow-wrap:break-word}
.opts{margin-left:46px;animation:up .3s .08s both}.opts .opt:last-child{margin-bottom:0}
.opt kbd{width:26px;height:26px;border:1.5px solid var(--muted);border-radius:50%;display:inline-grid;place-items:center;align-self:center}
.opt{align-items:center}
.sc{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sc>b{font-size:42px;font-weight:800;line-height:1}.sc small{font-size:17px;font-weight:600}
.g{color:var(--good)}.r{color:var(--bad)}
.rw{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-top:8px;font-size:15px}
.rw .bar{grid-column:1/-1;background:var(--panel);height:6px}
.rw .bar i{animation:grow .7s cubic-bezier(.3,.9,.4,1)}
.pill{display:inline-block;font-weight:700;padding:3px 13px;border-radius:9px;background:var(--panel)}
.pill.w{color:var(--warn)}
.notes{margin:10px 0 0;padding-left:19px;font-size:15px}
.sec{margin-top:9px;padding-top:9px;border-top:1px dashed color-mix(in srgb,var(--muted) 40%,transparent)}
.foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed color-mix(in srgb,var(--muted) 40%,transparent);font-size:15px}
.saved{margin-left:auto;color:var(--good);font-weight:600;white-space:nowrap}
.bub .link{display:block;margin-top:8px}
.dock{background:var(--panel);border-top:1px solid var(--line);padding:9px 14px max(10px,env(safe-area-inset-bottom))}
.dock>*{max-width:820px;margin-left:auto;margin-right:auto}
.d-row{display:flex;gap:10px}.d-row .btn{flex:1}
.d-end{display:flex;justify-content:flex-end;align-items:center;gap:16px;min-height:28px}
.later{color:var(--muted);text-decoration:none}
.d-in{display:flex;align-items:flex-end;gap:8px;margin-top:5px}
.d-in textarea{flex:1;border-radius:22px;padding:10px 16px;resize:none;line-height:1.4;max-height:120px}
.rnd{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink)}
.rnd svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rnd.send{background:var(--grad);color:#fff;border:0}
.rnd.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
#nav{padding-bottom:max(5px,env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <nav id="nav"></nav>
 <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ========== DỮ LIỆU MẪU: từ|loại|phiên âm|nghĩa|ví dụ|đồng nghĩa ========== */
const STARTER_RAW=`achieve|verb|/əˈtʃiːv/|đạt được, giành được|She worked hard to achieve her goals.|accomplish,attain
improve|verb|/ɪmˈpruːv/|cải thiện, nâng cao|Reading every day can improve your vocabulary.|enhance,better
reduce|verb|/rɪˈdjuːs/|giảm, làm giảm|We should reduce the amount of plastic we use.|decrease,lessen
require|verb|/rɪˈkwaɪə/|yêu cầu, đòi hỏi|This job requires a lot of patience.|need,demand
suggest|verb|/səˈdʒest/|đề nghị, gợi ý|My teacher suggested a good book for beginners.|propose,recommend
decide|verb|/dɪˈsaɪd/|quyết định|They decided to move to a smaller city.|choose,determine
avoid|verb|/əˈvɔɪd/|tránh, né tránh|You should avoid eating too much sugar.|evade,escape
increase|verb|/ɪnˈkriːs/|tăng, gia tăng|The company plans to increase prices next year.|raise,grow
develop|verb|/dɪˈveləp/|phát triển|He wants to develop his communication skills.|grow,expand
provide|verb|/prəˈvaɪd/|cung cấp|The hotel provides free breakfast for its guests.|supply,offer
compare|verb|/kəmˈpeə/|so sánh|Please compare these two photos carefully.|contrast,match
explain|verb|/ɪkˈspleɪn/|giải thích|Can you explain this rule to me again?|clarify,describe
borrow|verb|/ˈbɒrəʊ/|mượn, vay|May I borrow your pen for a minute?|loan,take

const nv=s=>s.toLowerCase().normalize('NFC').replace(/[.,;:!?"'()\[\]…]/g,' ').replace(/\s+/g,' ').trim();

function gradeVi(ans,vi){

 for(const alt of vi.split(/[,;\/]|\bhoặc\b/)){
  const b=noD(core(alt));if(!b)continue;
  if(a===b)return'ok';
  if(b.length>=4&&lev(a,b)<=Math.floor(b.length*.2))return'ok';
  if((' '+a+' ').includes(' '+b+' '))return'ok';

  const A=a.split(' '),B=b.split(' '),n=A.filter(x=>B.includes(x)).length;
  if(n/Math.max(A.length,B.length)>=.5)best='close';
 }
 return best;
}

document.addEventListener('input',e=>{if(e.target.id==='qIn'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'}if(e.target.id==='find'){search=e.target.value;const pos=e.target.selectionStart;render();const f=$('#find');f.focus();f.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{
 if(view!=='quiz'||!S||!S.q||$('#dlg').open)return;
 if(e.key==='Enter'&&!e.shiftKey){
  if(e.target.tagName==='BUTTON'&&!e.target.closest('#quiz'))return;
  if(S.fb){if(!S.fb.pending){e.preventDefault();A.next()}return}
  if(S.q.t==='type'||S.q.t==='write'){e.preventDefault();A.submit()}
  else if(S.q.t==='order'&&S.q.picked.length===S.q.toks.length){e.preventDefault();A.submit()}
  return}
 if(S.q.t==='mcq'&&!S.fb){const i='1234'.includes(e.key)?+e.key-1:'abcd'.indexOf(e.key.toLowerCase());if(e.key.length===1&&i>=0&&i<S.q.opts.length)answerMcq(i)}
});
render();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
